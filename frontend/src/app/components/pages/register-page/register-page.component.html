<div class="container">
    <div class="details">
        <app-title title="Registrazione" margin="3rem 0 1rem 0"></app-title>

        <form [formGroup]="registerForm" (ngSubmit)="submit()">
            <text-input
                [control]="fc.name"
                [showErrorsWhen]="isSubmitted"
                label="Name">
            </text-input>

            <text-input
                [control]="fc.email"
                [showErrorsWhen]="isSubmitted"
                label="Email"
                type="email">
            </text-input>

            <text-input
                [control]="fc.password"
                [showErrorsWhen]="isSubmitted"
                label="Password"
                type="password">
            </text-input>

            <text-input
                [control]="fc.confirmPassword"
                [showErrorsWhen]="isSubmitted"
                label="Confirm Password"
                type="password">
            </text-input>

            <text-input
                [control]="fc.address"
                [showErrorsWhen]="isSubmitted"
                label="Address">
            </text-input>

            <default-button text="Registrati"></default-button>

            <div class="login">
                Già un utente? &nbsp; <!--carattere speciale html per inserire uno spazio-->
                <a routerLink="/login" [queryParams]="{returnUrl: returnUrl}">
                    Login
                </a>
            </div>
        </form>
    </div>
</div>
