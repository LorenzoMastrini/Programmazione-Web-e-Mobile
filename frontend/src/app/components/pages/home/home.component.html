<app-side-bar></app-side-bar>
<app-not-found [visible]="!films || !films.length"
                resetLinkText="Cerca altro">
</app-not-found>

<div class="container">
    <ul>
        <li *ngFor="let film of films">
            <a routerLink="/film/{{film.id}}"
                [ngStyle]="{
                    'background-image': 'url(' + film.imageUrl + ')',
                    'background-size': 'cover'  }">
                
                <div class="content" >
                    <p class="name">
                        {{film.name}}
                    </p>

                    <button>
                        OTTIENI
                    </button>
                </div>
            </a>
        </li>
    </ul>
</div>
