<app-title title="Film" margin="3rem 1rem"></app-title>
<div class="container">
    <div class="movies-container">
        <div class="films-grid-container">
            <div class="film" *ngFor="let film of films">
                <img [src]="film.imageUrl"/>

                <div class="name">
                    <span>
                        {{film.name}}
                    </span>
                </div>
                
                <div class="film-buttons">
                    <button routerLink="/admin/films/modify/{{film.id}}" class="modify-film">
                        Modifica
                    </button>
                    <button (click)="deleteFilm(film.id)" class="delete-film">
                        Elimina
                    </button>
                </div>
            </div>
        </div>

        <div class="buttons-container">
            <default-button class="add-film-button" routerLink="/admin/add-film" text="Aggiungi film"></default-button>
        </div>
    </div>
</div>
