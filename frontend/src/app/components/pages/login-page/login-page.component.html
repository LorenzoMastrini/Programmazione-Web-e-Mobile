<div class="container">
    <div class="details">
        <app-title title="Login" margin="3rem 0 1rem 0"></app-title>

        <form [formGroup]="loginForm" (ngSubmit)="submit()">
            <text-input
                [control]="fc.email"
                [showErrorsWhen]="isSubmitted"
                type="email"
                label="Email">
            </text-input>

            <text-input
                [control]="fc.password"
                [showErrorsWhen]="isSubmitted"
                type="password"
                label="Password">
            </text-input>

            <default-button text="Login"></default-button>

            <div class="register">
                Nuovo utente? &nbsp;
                <a routerLink="/register" [queryParams]="{returnUrl: returnUrl}">
                    Registrati
                </a>
            </div>
        </form>
    </div>
</div>
