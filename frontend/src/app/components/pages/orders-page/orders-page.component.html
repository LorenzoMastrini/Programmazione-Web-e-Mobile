<app-not-found [visible]="!orders"
                notFoundMessage="Non hai ancora effettuato ordini!"
                resetLinkText="Torna alla Homepage">
</app-not-found>
&nbsp;
<div *ngIf="orders" class="container">
    <h3>I tuoi ordini:</h3>
    <table class="orders-list" *ngFor="let order of orders">
        <tr>
            <h1>Ordine del {{ order.createdAt.substring(0, 10) }}</h1>
        </tr>

        <tr>
            <td>
                <h4>Film</h4>
            </td>
            <td>
                <h4>Acquisto/Noleggio</h4>
            </td>
            <td>
                <h4>Prezzo dell'articolo</h4>
            </td>
        </tr>

        <tr *ngFor="let item of order.orderItems">
            <td class="name-and-image">
                <img [src]="item.film.imageUrl" [alt]="item.film.name">
                {{ item.film.name }}
            </td>
            <td>
                {{ item.purchaseMethod }}
            </td>
            <td>
                {{ item.totalArticlePrice | currency:'EUR' }}
            </td>
        </tr>

        <tr>
            <td colspan="2"></td>
            <span><strong>Prezzo totale:</strong> {{ order.totalPrice | currency:'EUR' }}</span>
        </tr>
    </table>
</div>
