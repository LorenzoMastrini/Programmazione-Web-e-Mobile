<app-side-bar></app-side-bar>

<div class="container">
    <filters-bar (orderByParameter)="orderBy($event)"></filters-bar>

    <app-not-found [visible]="!films || !films.length"
                    resetLinkText="Reset filtri"
                    resetLinkRoute="/discover-page">
    </app-not-found>

    <ul>
        <li *ngFor="let film of films">
            <a routerLink="/film/{{film.id}}"
                [ngStyle]="{
                    'background-image': 'url(' + film.imageUrl + ')',
                    'background-size': 'cover'  }">
                
                <!--uso [] per dati dinamici-->
                <div class="content" >
                    <p class="name">
                        {{film.name}}
                    </p>

                    <button>
                        OTTIENI
                    </button>
                </div>
            </a>
        </li>
    </ul>
</div>
