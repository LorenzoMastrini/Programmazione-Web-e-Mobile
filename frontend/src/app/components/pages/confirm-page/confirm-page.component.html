<app-title title="Ordine confermato"></app-title>

<div class="container">
    <div class="content">
        <div class="summary">
            <div>
                <h3>Nome:</h3>
                <span>{{ order.name }}</span>
            </div>
            <div>
                <h3>Indirizzo:</h3>
                <span>{{ order.address }}</span>
            </div>
        </div>
        <order-items-list [order]="order"></order-items-list>
    </div>

    <div class="buttons-container">
        <div class="buttons">
            <button (click)="returnToHomepage()">Torna alla home</button>
        </div>
    </div>
</div>
