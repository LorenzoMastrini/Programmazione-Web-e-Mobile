<div class="container">
    <div class="content">
        <app-title title="Ordine" fontSize="1.6rem"></app-title>
        <form [formGroup]="checkoutForm">
            <text-input [control]="fc.name" label="Nome"></text-input>
            <text-input [control]="fc.address" label="Indirizzo"></text-input>
        </form>

        <order-items-list [order]="order"></order-items-list>
    </div>

    <div class="buttons-container">
        <div class="buttons">
            <button (click)="createOrder()">Vai al pagamento</button>
        </div>
    </div>
</div>
