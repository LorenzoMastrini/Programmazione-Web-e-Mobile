<app-title title="Ordine"></app-title>

<div class="container">
    <form [formGroup]="checkoutForm">
        <text-input
            [control]="fc.name"
            [showErrorsWhen]="isSubmitted"
            label="Nome">
        </text-input>
        <text-input
            [control]="fc.address"
            [showErrorsWhen]="isSubmitted"
            label="Indirizzo">
        </text-input>
        <text-input
            [control]="fc.cardNumber"
            [showErrorsWhen]="isSubmitted"
            [maxlength]="16"
            label="Numero Carta">
        </text-input>
        <text-input
            [control]="fc.expireDate"
            [showErrorsWhen]="isSubmitted"
            label="Data di Scadenza">
        </text-input>
        <text-input
            [control]="fc.cvv"
            [showErrorsWhen]="isSubmitted"
            [maxlength]="3"
            label="CVV">
        </text-input>
    </form>

    <order-items-list [order]="order"></order-items-list>

    <button (click)="createOrder()">Acquista</button>
</div>
