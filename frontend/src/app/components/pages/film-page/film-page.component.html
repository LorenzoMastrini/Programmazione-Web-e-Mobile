<app-side-bar></app-side-bar>
<app-not-found [visible]="!film"
                notFoundMessage="Film non trovato!"
                resetLinkText="Torna alla Homepage">
</app-not-found>

<div *ngIf="film" class="container">
    <img [src]="film.imageUrl" [alt]="film.name"/>

    <div class="info">
        <span class="name">
            {{ film.name }}
        </span>

        <div class="general">
            <span class="duration">
              {{ film.duration }} min
            </span>
            <div class="tags">
                <a *ngFor="let tag of film.genres" routerLink="/tag/{{tag}}">
                    {{ tag }}
                </a>
            </div>
            <span class="score">
                {{ film.score }}/5 &#9733;
            </span>
        </div>
        
        <div class="details">
            <span class="director">
                <strong>Regista:&nbsp;</strong>{{ film.director }}
            </span>

            <span class="year">
                <strong>Anno:&nbsp;</strong> {{ film.year }}
            </span>

            <span class="country">
                <strong>Paese di produzione:&nbsp;</strong> {{ film.country }}
            </span>

            <span class="plot">
                {{ film.plot }}
            </span>
        </div>

        <div class="purchase-info">
            <span class="price">
                {{ film.price | currency:'EUR' }}
            </span>
            <span class="price-rent">
                {{ film.priceRent | currency:'EUR' }} al giorno
            </span>
        </div>
        
        <default-button text="Aggiungi al carrello" (click)="addToCart()"></default-button>
    </div>
</div>
