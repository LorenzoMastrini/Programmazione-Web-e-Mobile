<app-title title="Modifica film" margin="3rem 0 0 0"></app-title>
<app-not-found [visible]="!film"
                notFoundMessage="Film non trovato!"
                resetLinkText="Torna alla Homepage">
</app-not-found>

<div *ngIf="film" class="container">
    <form [formGroup]="modifyFilmForm" (ngSubmit)="submit()">
        <div class="name-and-image">
            <span class="name">
                {{ film.name }}
            </span>

            <img [src]="film.imageUrl" [alt]="film.name"/>
            <text-input
                [control]="fc.imageUrl"
                [showErrorsWhen]="isSubmitted"
                label="URL della copertina">
            </text-input>
        </div>

        <div class="info">
            <div class="general-info">
                <span>Informazioni generali:</span>
                <text-input
                    [control]="fc.name"
                    [showErrorsWhen]="isSubmitted"
                    label="Nome">
                </text-input>

                <div class="menu-with-unit">
                    <text-input
                        [control]="fc.duration"
                        [showErrorsWhen]="isSubmitted"
                        [maxlength]="3"
                        label="Durata"
                        width="26rem">
                    </text-input>
                    <span class="min">min</span>
                </div>

                <input-container class="genres-container" height="15rem" label="Genere">
                    <div>
                        <label formArrayName="genres" class="checkbox-label" *ngFor="let genre of genresFormArray.controls; let i = index">
                            <input type="checkbox" class="checkbox" [formControlName]="i">
                            {{ genres[i].name }}
                        </label>
                    </div>
                </input-container>

                <text-input
                    [control]="fc.director"
                    [showErrorsWhen]="isSubmitted"
                    label="Regista">
                </text-input>

                <text-input
                    [control]="fc.year"
                    [showErrorsWhen]="isSubmitted"
                    [maxlength]="4"
                    label="Anno">
                </text-input>

                <text-input
                    [control]="fc.country"
                    [showErrorsWhen]="isSubmitted"
                    label="Paese di produzione">
                </text-input>

                <text-input
                    [control]="fc.plot"
                    [showErrorsWhen]="isSubmitted"
                    type="textarea"
                    height="15rem"
                    label="Trama">
                </text-input>

                <div class="menu-with-unit">
                    <text-input
                        [control]="fc.score"
                        [showErrorsWhen]="isSubmitted"
                        label="Valutazione"
                        width="27rem">
                    </text-input>
                    <span>/5</span>
                </div>

                <label class="checkbox-label">
                    <input [formControl]="fcTrending" class="checkbox" id="trending" type="checkbox" name="trending" value="checked" [checked]="film.trending">
                    In tendenza
                </label>
            </div>

            <div class="purchase-info">
                <span>Informazioni sull'acquisto:</span>
                <input-container height="7.5rem" label="Metodi d'acquisto disponibili">
                    <div class="radio-menu">
                        <label class="radio-label">
                            <input [formControl]="fcPurchaseMethodsAvailable" class="radio-button" id="purchaseMethodsAvailable" type="radio" name="purchaseMethodsAvailable" value="buyOnly">
                            Solo acquisto
                        </label>
                        <label class="radio-label">
                            <input [formControl]="fcPurchaseMethodsAvailable" class="radio-button" id="purchaseMethodsAvailable" type="radio" name="purchaseMethodsAvailable" value="rentOnly">
                            Solo noleggio
                        </label>
                        <label class="radio-label">
                            <input [formControl]="fcPurchaseMethodsAvailable" class="radio-button" id="purchaseMethodsAvailable" type="radio" name="purchaseMethodsAvailable" value="both">
                            Acquisto e noleggio
                        </label>
                    </div>
                </input-container>

                <div class="menu-with-unit" *ngIf="!(fcPurchaseMethodsAvailable.value === 'rentOnly')">
                    <text-input
                        [control]="fc.price"
                        [showErrorsWhen]="isSubmitted"
                        label="Prezzo per l'acquisto"
                        width="27rem">
                    </text-input>
                    <span>€</span>
                </div>

                <div class="menu-with-unit" *ngIf="!(fcPurchaseMethodsAvailable.value === 'buyOnly')">
                    <text-input
                        [control]="fc.priceRent"
                        [showErrorsWhen]="isSubmitted"
                        label="Prezzo per il noleggio"
                        width="27rem">
                    </text-input>
                    <span>€</span>
                </div>

                <default-button text="Conferma modifiche"></default-button>
            </div>
        </div>
    </form>
</div>
