<app-side-bar></app-side-bar>
<app-not-found [visible]="!film"
                notFoundMessage="Film non trovato!"
                resetLinkText="Torna alla Homepage">
</app-not-found>

<app-title title="Modifica film"></app-title>

<div *ngIf="film" class="container">
    <form class="form" [formGroup]="modifyFilmForm" (ngSubmit)="submit()">
        <div class="name-and-image">
            <span class="name">
                {{ film.name }}
            </span>

            <img [src]="film.imageUrl" [alt]="film.name"/>
            <text-input
                [control]="fc.imageUrl"
                [showErrorsWhen]="isSubmitted"
                type="text"
                label="URL della copertina">
            </text-input>
        </div>

        <div class="info">
            <div class="general-info">
                <span>Informazioni generali:</span>
                <text-input
                    [control]="fc.name"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Nome">
                </text-input>

                <text-input
                    [control]="fc.duration"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Durata">
                </text-input>

                <text-input
                    [control]="fc.genres"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Genere">
                </text-input>

                <text-input
                    [control]="fc.director"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Regista">
                </text-input>

                <text-input
                    [control]="fc.year"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Anno">
                </text-input>

                <text-input
                    [control]="fc.country"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Paese di produzione">
                </text-input>

                <text-input
                    [control]="fc.plot"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Trama">
                </text-input>

                <text-input
                    [control]="fc.score"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Valutazione">
                </text-input>

                <text-input
                    [control]="fc.favorite"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Preferiti">
                </text-input>
            </div>

            <div class="purchase-info">
                <span>Informazioni sull'acquisto:</span>
                <text-input
                    [control]="fc.price"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Prezzo per l'acquisto">
                </text-input>

                <text-input
                    [control]="fc.rentable"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Noleggiabile">
                </text-input>

                <text-input
                    [control]="fc.priceRent"
                    [showErrorsWhen]="isSubmitted"
                    type="text"
                    label="Prezzo per il noleggio">
                </text-input>

                <default-button text="Conferma modifiche"></default-button>
            </div>
        </div>
    </form>
</div>
