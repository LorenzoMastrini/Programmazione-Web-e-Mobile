<app-title title="Carrello" margin="1.5rem 0 0 2.5rem"></app-title>
<app-not-found [visible]="!cart || !cart.items.length"
                notFoundMessage="Cart Page is Empty!"
                resetLinkText="Go to Homepage">
</app-not-found>

<div *ngIf="cart && cart.items.length" class="container">
    <ul>
        <li *ngFor="let cartItem of cart.items">
            <app-purchase-menu [film]="cartItem.film" [cart]="cart"></app-purchase-menu>

            <div>
                <button class="remove-button" (click)="removeFromCart(cartItem)">
                    Remove
                </button>
            </div>
        </li>
    </ul>

    <div class="checkout">
        <div>
            <div class="films-count">{{ cart.totalCount }}</div>
            <div class="totalPrice">{{ cart.totalPrice | currency }}</div>
        </div>
        <a routerLink="/checkout">Proceed to Checkout</a>
    </div>
</div>
