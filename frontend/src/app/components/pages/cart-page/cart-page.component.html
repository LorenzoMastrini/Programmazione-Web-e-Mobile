<app-title title="Carrello" margin="3rem 1rem"></app-title>
<app-not-found [visible]="!cart || !cart.items.length"
                notFoundMessage="Il carrello è vuoto!"
                resetLinkText="Torna alla Homepage">
</app-not-found>

<div *ngIf="cart && cart.items.length" class="container">
    <ul>
        <li *ngFor="let cartItem of cart.items">
            <div class="film">
                <img [src]="cartItem.film.imageUrl" [alt]="cartItem.film.name">
                <a routerLink="/film/{{cartItem.film.id}}">
                    {{ cartItem.film.name }}
                </a>
            </div>
            
            <app-purchase-menu [cartItem]="cartItem" [cart]="cart"></app-purchase-menu>
            <div>
                <button class="remove-button" (click)="removeFromCart(cartItem)">
                    Rimuovi
                </button>
            </div>
        </li>
    </ul>

    <div class="checkout">
        <div>
            <div class="films-count">{{ cart.totalCount }}</div>
            <div class="total-price">{{ cart.totalPrice | currency }}</div>
        </div>
        <a routerLink="/checkout">Prosegui al checkout</a>
    </div>
</div>
