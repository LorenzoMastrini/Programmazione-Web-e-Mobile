<app-title title="Cart Page" margin="1.5rem 0 0 2.5rem"></app-title>

<div class="container">
    <ul>
        <li *ngFor="let cartItem of cart.items">
            <div>
                <img [src]="cartItem.film.imageUrl" [alt]="cartItem.film.name">
            </div>
            <div>
                <a routerLink="/film/{{cartItem.film.id}}">
                    {{ cartItem.film.name }}
                </a>
            </div>
            <div>
                <select #quantitySelect
                        [value]="cartItem.quantity"
                        (change)="changeQuantity(cartItem, quantitySelect.value)">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
            <div>
                {{ cartItem.price | currency }}
            </div>
            <div>
                <button class="remove-button" (click)="removeFromCart(cartItem)">
                    Remove
                </button>
            </div>
        </li>
    </ul>

    <div class="checkout">
        <div>
            <div class="films-count">{{ cart.totalCount }}</div>
            <div class="totalPrice">{{ cart.totalPrice | currency }}</div>
        </div>
        <a routerLink="/checkout">Proceed to Checkout</a>
    </div>
</div>
