<app-side-bar></app-side-bar>
<app-not-found [visible]="!films || !films.length"
                resetLinkText="Reset Search">
</app-not-found>

<!--questo componente è identico all'home-component, se non che visualizza solo i film preferiti (attributo favorite = true)-->
<div class="container">
    <ul>
        <li *ngFor="let film of films">
            <a *ngIf="film.favorite" routerLink="/film/{{film.id}}"
                [ngStyle]="{
                    'background-image': 'url(' + film.imageUrl + ')',
                    'background-size': 'cover'  }">
                
                <div class="content" >
                    <p class="name">
                        {{film.name}}
                    </p>

                    <button>
                        OTTIENI
                    </button>
                </div>
            </a>
        </li>
    </ul>
</div>
