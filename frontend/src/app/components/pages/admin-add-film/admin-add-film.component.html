<div class="add-film">
    <div class="container">
        <app-title title="Aggiungi film"></app-title>

        <form [formGroup]="addFilmForm" (ngSubmit)="submit()">
            <text-input
                [control]="fc.name"
                [showErrorsWhen]="isSubmitted"
                type="text"
                label="Nome">
            </text-input>

            <text-input
                [control]="fc.imageUrl"
                [showErrorsWhen]="isSubmitted"
                type="text"
                label="URL della copertina">
            </text-input>

            <default-button text="Aggiungi film"></default-button>
        </form>
    </div>
</div>
