<app-title title="Ordini" margin="3rem 0 0 1rem"></app-title>

<app-not-found [visible]="!orders"
                notFoundMessage="Non ci sono ordini presenti nel database!"
                resetLinkText="Torna alla Homepage">
</app-not-found>

<div *ngIf="orders" class="container">
    <table class="orders-list" *ngFor="let order of orders">
        <tr>
            <span>Ordine n. {{ order.id }}</span>
        </tr>

        <tr>
            <span>Nome: {{ order.name }}</span>
        </tr>
        <tr>
            <span>Indirizzo: {{ order.address }}</span>
        </tr>
        <tr>
            <span>Data: {{ order.createdAt }}</span>
        </tr>

        <tr>
            <td>
                <h4>Film</h4>
            </td>
            <td>
                <h4>Acquisto/Noleggio</h4>
            </td>
            <td>
                <h4>Prezzo dell'articolo</h4>
            </td>
        </tr>

        <tr *ngFor="let item of order.orderItems">
            <td>
                {{ item.film.name }}
            </td>
            <td>
                {{ item.purchaseMethod }}
            </td>
            <td>
                {{ item.totalArticlePrice | currency:'EUR' }}
            </td>
        </tr>

        <tr>
            <td colspan="3"></td>
            <span>Prezzo totale: {{ order.totalPrice | currency:'EUR' }}</span>
        </tr>
    </table>
</div>
