<header>
    <div class="container">
        <a *ngIf="user.isAdmin" routerLink="/admin" class="logo">Kinetoscope</a>
        <a *ngIf="!user.isAdmin" routerLink="/" class="logo">Kinetoscope</a>
        <nav>
            <ul>
                <li>
                    <a routerLink="search">
                        <search></search>
                    </a>
                </li>

                <!--mostro il pulsante login solo se l'utente non è autenticato-->
                <li *ngIf="!isAuth">
                    <a routerLink="/login">Login</a>
                </li>

                <!--mostro il menu utente solo se l'utente è autenticato-->
                <li *ngIf="isAuth" class="menu-container">
                    <a class="username">{{ user.name }}</a>
                    <div class="menu">
                        <a *ngIf="!user.isAdmin" routerLink="/profile">Profilo</a>
                        <a *ngIf="!user.isAdmin" routerLink="/orders/{{user.token}}">Ordini</a>
                        <a *ngIf="user.isAdmin" routerLink="/admin/orders">Ordini</a>
                        <a (click)="logout()">Logout</a>
                    </div>
                </li>
                
                <li>
                    <a *ngIf="!user.isAdmin" routerLink="/cart-page">
                        Carrello <span *ngIf="cartQuantity">{{ cartQuantity }}</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
