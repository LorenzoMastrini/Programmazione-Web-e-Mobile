<div class="container">
    <!--In base al bottone scelto mostra il prezzo corrispondente-->
    <div class="radio-buttons">
        <label class="radio-label">
            <input  class="radio" id="buy" type="radio" name="buyRent{{cartItem.film.id}}" checked value="0" (change)="changeIdentificationType()">
            Compra
        </label>
        <label class="radio-label">
            <input class="radio" id="rent" type="radio" name="buyRent{{cartItem.film.id}}" value="1" (change)="changeIdentificationType()">
            Noleggia
        </label>
    </div>

    <div>
        <!--Noleggia-->
        <div class="price" *ngIf="this.cartItem.purchaseMethod == 'Noleggio'">
            {{ cartItem.film.priceRent | currency }}
        </div>
        <div class="price" *ngIf="this.cartItem.purchaseMethod == 'Acquisto'">
            {{ cartItem.film.price | currency }}
        </div>
    </div>
</div>
