<div class="container">
   <nav>
       <ul>
           <li class="genres-menu-container">
               Genere
               <div class="genres-menu" *ngIf="genres">
                   <a *ngFor="let genre of genres" routerLink="/discover-page/genres/{{genre.name}}">
                       {{ genre.name }}({{ genre.count }})
                   </a>
               </div>
           </li>

           <li class="menu-container">
               Prezzo (acquisto)
               <div class="menu">
                    <a (click)="changePriceFilter('0-5')">0€ - 5€</a>
                    <a (click)="changePriceFilter('5-10')">5€ - 10€</a>
                    <a (click)="changePriceFilter('10-15')">10€ - 15€</a>
                    <a (click)="changePriceFilter('15-20')">15€ - 20€</a>
               </div>
           </li>

           <li class="menu-container">
               Compra/Noleggia
               <div class="menu">
                    <a (click)="changePurchaseMethodFilter('buyOnly')">Solo acquisto</a>
                    <a (click)="changePurchaseMethodFilter('rentOnly')">Solo noleggio</a>
                    <a (click)="changePurchaseMethodFilter('both')">Entrambi</a>
               </div>
           </li>

           <li class="menu-container">
                Ordina per
                <div class="menu">
                    <a (click)="sendOrderByParameterToParent('name')">Nome</a>
                    <a (click)="sendOrderByParameterToParent('priceBuy')">Prezzo acquisto</a>
                    <a (click)="sendOrderByParameterToParent('priceRent')">Prezzo noleggio</a>
                    <a (click)="sendOrderByParameterToParent('duration')">Durata</a>
                    <a (click)="sendOrderByParameterToParent('rating')">Rating</a>
                </div>
            </li>

           <li routerLink="/discover-page">Resetta filtri</li>
       </ul>
   </nav>
</div>
